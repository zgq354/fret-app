<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0d10" />
    <title>页面不存在 · 弦音地图</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0b0d10;
        color: #f3f4f6;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        box-sizing: border-box;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #2a2e35;
        border-radius: 20px;
        background: #11151a;
        box-shadow: 0 18px 60px rgb(0 0 0 / 28%);
      }

      p {
        margin: 0;
        color: #aeb4bf;
        line-height: 1.65;
      }

      strong {
        display: block;
        margin: 8px 0 12px;
        font-size: clamp(24px, 7vw, 34px);
        letter-spacing: -0.03em;
      }

      a {
        display: inline-flex;
        margin-top: 24px;
        padding: 10px 16px;
        border-radius: 999px;
        color: #0b0d10;
        background: #e6b566;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      a:hover {
        background: #f0c477;
      }

      a:focus-visible {
        outline: 3px solid rgb(230 181 102 / 40%);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <strong>这里没有对应的练习页面</strong>
      <p>弦音地图目前只有一个应用入口，可以从首页继续。</p>
      <a href="/">返回弦音地图</a>
    </main>
  </body>
</html>
